name: Extract ZIP

on:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p temp_extract

          for zip in *.zip; do
            [ -f "$zip" ] || continue

            unzip -q -o "$zip" -d temp_extract

            # If ZIP contains one top-level folder,
            # copy its CONTENTS to repository root
            top_dir=$(find temp_extract -mindepth 1 -maxdepth 1 -type d | head -n 1)

            if [ -n "$top_dir" ]; then
              cp -a "$top_dir"/. .
            else
              cp -a temp_extract/. .
            fi

            rm "$zip"
          done

          rm -rf temp_extract

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if ! git diff --cached --quiet; then
            git commit -m "Extract ZIP contents"
            git push
          fi
