unzip -o "$zip" -d .
``` :chatgpt-content-reference{index="1"}


### Fix it

Edit `.github/workflows/extract-zip.yml` and replace the extraction step with:

```yaml
- name: Extract ZIP files
  run: |
    for zip in *.zip; do
      [ -f "$zip" ] || continue

      mkdir -p extracted
      unzip -o "$zip" -d extracted

      # Move contents of the ZIP's top-level folder to repo root
      find extracted -mindepth 1 -maxdepth 1 -type d -exec sh -c '
        cp -r "$1"/. .
      ' _ {} \;

      find extracted -mindepth 1 -maxdepth 1 -type f -exec cp {} . \;

      rm -rf extracted
      rm "$zip"
    done
